<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バグ将棋 — BUG SHOGI</title> <link rel="icon" type="image/png" href="Bugshogi.png"><style>:root{--line:#35423a;--lime:#c3f36a;--cream:#e8e1ce;--muted:#89958c;--tile:#d9cda9;--tile2:#c9bc97;--ink:#23312a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#26352d,#111817 65%);color:var(--cream);font-family:'Segoe UI','Meiryo',sans-serif}.shell{max-width:1400px;margin:auto;min-height:100vh;padding:0 40px;display:flex;flex-direction:column}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;font-weight:bold;letter-spacing:.1em}.brand-mark{background:var(--lime);color:#172018;font:700 12px monospace;padding:9px}.topbar small{display:block;font:10px monospace;color:var(--muted);margin-top:3px}.top-meta{margin-left:auto;font:10px monospace;color:#a7b1aa}main{flex:1;padding:35px 0 50px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:end;padding:10px 0 30px}.eyebrow,.id{font:10px monospace;letter-spacing:.18em;color:var(--lime)}.hero h1{font-size:clamp(52px,8vw,100px);line-height:.95;letter-spacing:-.07em;margin:16px 0 10px}.hero h1 span{color:var(--lime)}.aside{border-left:1px solid var(--line);padding:10px 22px;color:#a5aea6;font-size:12px;line-height:2}.actions{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.btn{border:0;border-radius:5px;padding:13px 20px;font-weight:700;cursor:pointer}.primary{background:var(--lime);color:#172018}.secondary{background:#27332d;border:1px solid #45534a;color:var(--cream)}.head{display:flex;align-items:end;justify-content:space-between;margin:24px 0 12px}.head h2{font-size:17px;margin:0}.head p,.gamehead p{font-size:11px;color:var(--muted);margin:5px 0 0}.area-row{display:flex;gap:8px;overflow:auto;margin-bottom:13px}.area{flex:1;min-width:100px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:5px;background:#1a2320;color:#aab4ab;cursor:pointer}.area.active{border-color:var(--lime);background:#26322a}.area small{display:block;color:#738078;font:9px monospace;margin-bottom:6px}.area strong{font-size:10px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{min-height:94px;text-align:left;padding:12px;border:1px solid #354139;border-radius:5px;background:#1a2320;color:var(--cream);cursor:pointer}.card:hover:not(:disabled){border-color:var(--lime);transform:translateY(-2px)}.card:disabled{opacity:.38;cursor:not-allowed}.card.clear:after{content:'CLEAR';float:right;color:var(--lime);font:8px monospace}.name{display:block;font-weight:700;font-size:12px;margin:7px 0 5px}.hint{font-size:9px;color:#859188}.layout{display:grid;grid-template-columns:minmax(400px,1fr) 310px;gap:22px;align-items:start}.gamehead{display:flex;justify-content:space-between;margin-bottom:15px}.gamehead h1{font-size:24px;margin:3px 0}.pill{padding:8px 10px;background:#29362f;border:1px solid #46574a;border-radius:4px;font:10px monospace;color:var(--lime)}.wrap{background:#1a211d;padding:12px;border:1px solid #46534a;border-radius:7px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;border:2px solid #6a5b3d;overflow:hidden}.cell{position:relative;background:var(--tile);border:1px solid #a99b77;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:var(--ink);min-width:0;min-height:0;width:100%;height:100%}.cell:nth-child(odd){background:var(--tile2)}.cell.sel{box-shadow:inset 0 0 0 4px #9be43f}.cell.legal:after{content:'';width:23%;height:23%;border-radius:50%;background:#78a74299;position:absolute}.cell.cap:after{content:'';position:absolute;inset:3px;border:3px solid #dc6454;border-radius:4px}.piece{width:75%;height:84%;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,94% 18%,85% 100%,15% 100%,6% 18%);background:#e8dfc6;color:#26322c;font-weight:800;font-size:clamp(13px,2.4vw,25px);padding-top:5px}.piece.enemy{transform:rotate(180deg);background:#303b34;color:#f2e8ce}.piece.prom{color:#bd4938}.hp{position:absolute;left:10%;right:10%;bottom:4px;height:3px;background:#693d32}.hp i{display:block;height:100%;background:#a6db55}.side{display:grid;gap:12px}.panel{background:#1b2421;border:1px solid #35423a;border-radius:6px;padding:15px}.pt{font:10px monospace;letter-spacing:.16em;color:#97a39a;margin-bottom:11px}.tags,.hand{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:9px;padding:5px 7px;border:1px solid #46554b;border-radius:3px;background:#25302a}.tag.hot{color:var(--lime)}.rule-text,.ctrl{font-size:10px;color:#aab4ab;line-height:1.9}.toast{padding:9px 12px;background:#26342b;border-left:2px solid var(--lime);font-size:10px;min-height:36px}.hand button{font-size:18px;background:#29352e;border:1px solid #405047;color:var(--cream);width:35px;height:36px;cursor:pointer}.modalbg{position:fixed;inset:0;background:#080c0bd9;display:grid;place-items:center;z-index:5;padding:20px}.modal{background:#1b2421;border:1px solid #586b5c;border-radius:7px;padding:25px;max-width:430px;width:100%}.modal h2{margin:8px 0}.modal p{font-size:12px;color:#a9b3aa;line-height:1.8}.shoot{height:min(60vh,550px);min-height:360px;margin:15px 0;background:#18231e;border:1px solid #53624f;position:relative;overflow:hidden;background-image:linear-gradient(#aab98a16 1px,transparent 1px),linear-gradient(90deg,#aab98a16 1px,transparent 1px);background-size:11.11% 11.11%}.heroUnit,.boss{position:absolute;transform:translateX(-50%);font-size:42px}.heroUnit{left:50%;bottom:7%;color:var(--lime)}.boss{left:50%;top:8%;color:#ff786d;font-size:58px}.bullet{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffb14f;box-shadow:0 0 12px #ff6c51}.progress-line{height:5px;background:#313c35;border-radius:5px;overflow:hidden}.progress-line i{display:block;height:100%;background:var(--lime)}footer{border-top:1px solid var(--line);height:50px;display:flex;align-items:center;justify-content:space-between;font:9px monospace;color:#77827b}@media(max-width:850px){.shell{padding:0 18px}.hero{grid-template-columns:1fr}.aside{display:none}.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:0 10px}.grid{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr 1fr}.wrap{padding:5px}.piece{font-size:16px}.area{min-width:115px;flex:unset}}

.cell.blocked{background:#c77b70!important;cursor:not-allowed}.cell.blocked:before{content:"×";position:absolute;z-index:2;color:#732f2a;font-size:26px;font-weight:bold}

.piece.commander{background:linear-gradient(135deg,#ff4d6d,#ffb84d,#fff05a,#63e685,#47d4ff,#9273ff,#f052d0);background-size:300% 300%;color:#111!important;text-shadow:0 0 7px white;animation:commander-rainbow 1.5s linear infinite}@keyframes commander-rainbow{0%{background-position:0% 50%;filter:hue-rotate(0deg)}50%{background-position:100% 50%;filter:hue-rotate(180deg)}100%{background-position:0% 50%;filter:hue-rotate(360deg)}}

.hp-roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-height:190px;overflow:auto;margin:-3px 0 14px}.hp-unit{min-width:0;background:#151e1a;border:1px solid #344239;border-radius:3px;padding:5px 6px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 5px;font:9px monospace;color:#d8e3d8}.hp-unit>span{font-weight:bold;color:var(--lime)}.hp-unit>b{text-align:right;white-space:nowrap}.hp-unit small{color:#829087;font-size:8px}.hp-unit>i{grid-column:1/-1;display:block;height:3px;background:#303a33}.hp-unit>i>i{display:block;height:100%;background:var(--lime)}@media(max-width:560px){.hp-roster{grid-template-columns:repeat(4,minmax(0,1fr));max-height:150px}}

</style></head><body><div class="shell"><header class="topbar"><b class="brand-mark">BUG</b><span>バグ将棋<small>SHOGI.EXE / build 1.0</small></span><span class="top-meta">● SYSTEM ONLINE / AUTO SAVE ON</span></header><main id="app"></main><footer>BUG SHOGI — 将棋の常識を、100ステージかけて破壊する。<span><a href="#terms" id="termsLink" class="terms-link">利用規約</a>　LOCAL SAVE ●</span></footer></div><script>const app=document.getElementById('app');
const areaNames=['バグの入口','チェス汚染区域','HP崩壊区域','能力暴走区域','弾幕将棋区域','物理崩壊区域','時空バグ区域','複合バグ区域','理不尽将棋区域','バグの王'];
const stageNames='いつもの将棋|歩兵の反抗期|飛車の二重人格|角行の大暴走|王将の筋トレ|歩兵増殖事件|反抗する盤面|先手が二度動く|敵だけ高速化|最初のバグ王|桂馬が跳びすぎる|将棋盤なのにチェス|歩兵ナイト化|飛車クイーン化|王将ルーク化|全員クイーン|動けない王将|斜めしか動けない|移動方向反転|チェス将軍|駒にHPが生えた|全駒HP制|王将HP1|歩兵HP10000|飛車の装甲|回復する金将|爆発する駒|不死身の歩兵|HP吸収合戦|HPの暴君|テレポート歩兵|分裂する桂馬|シールド飛車|透明な角行|爆弾香車|コピー将軍|反射する銀将|暴走金将|全能力解禁|能力の化身|飛車が弾を撃つ|角行レーザー|歩兵マシンガン|扇状弾幕|円形弾幕|誘導弾の恐怖|レーザー地獄|弾幕と将棋|全駒シューター|弾幕将軍|重力将棋|落下する駒|反射盤面|滑る将棋|縮む盤面|崩れる盤面|浮遊する駒|物理演算暴走|盤面崩壊|物理の支配者|時間加速|時間停止|二回行動の世界|未来の自分|過去への巻き戻し|位置交換|無限ワープ|時間差攻撃|時空崩壊|時空の支配者|チェスとHP|弾幕と重力|分裂する弾幕|時間制限とHP|ワープ弾幕|不死身のシューター|縮小する戦場|全ルール混合|超複合将棋|バグ融合体|全駒高HP|敵だけ二回行動|超高速弾幕|盤面ランダム変形|コピー地獄|無限増殖軍団|バグ連鎖|王将狩り|全バグ解禁|終末の将棋|盤面が信用できない|駒の能力がランダム|全駒シューティング|重力と時間の崩壊|将棋のルール消失|バグの集合体|100体の王将|世界のバグ|最終防衛線|バグの王'.split('|');
const stages=stageNames.map((name,i)=>({id:i+1,name,area:(i/10)|0,boss:i%10===9,shooter:i>=40&&i<50||[72,73,75,76,83,93].includes(i+1)}));
const glyph={K:'王',R:'飛',B:'角',G:'金',S:'銀',N:'桂',L:'香',P:'歩',C:'将','+P':'と','+S':'全','+N':'圭','+L':'杏','+B':'馬','+R':'龍'};
let save={cleared:[],max:1};try{save=Object.assign(save,JSON.parse(localStorage.getItem('bug-shogi-save')||'{}'))}catch{}let area=0,game=null,stage=null,timer=null,limitTimer=null;
function usesPieceHP(id){return id>=21&&id<=30||[70,71,74,78,79,80,81,89,90,100].includes(id)}function canSummonCommander(id){return [24,28,30,70,81,90,100].includes(id)}function summonCommander(){if(!game||game.mode==='shoot'||game.commanderSummoned)return false;let king=game.pieces.find(q=>q.s===-1&&q.t==='K');if(!king)return false;let spots=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){let cx=king.x+dx,cy=king.y+dy;if(inside([cx,cy])&&!at(cx,cy)&&!blockedCell(cx,cy))spots.push([cx,cy])}spots.sort((a,b)=>Math.max(Math.abs(a[0]-king.x),Math.abs(a[1]-king.y))-Math.max(Math.abs(b[0]-king.x),Math.abs(b[1]-king.y)));if(!spots.length){game.toast='王将の隣に空きマスがありません。';draw();return false}let [x,y]=spots[0],c=p('C',-1,x,y);c.name='コマンダー';c.hp=c.maxHp=99999;c.armor=99999;c.attack=99999;game.pieces.push(c);game.commanderSummoned=true;game.sel=c;game.toast='コマンダー召喚！ HP 99999 / 装甲 99999 / 攻撃：対象を一撃破壊';draw();return true}
function saveIt(){localStorage.setItem('bug-shogi-save',JSON.stringify(save))}function p(t,s,x,y){return{t,s,x,y,hp:100}}
function initBoard(){let a=[],back=['L','N','S','G','K','G','S','N','L'];back.forEach((t,x)=>{a.push(p(t,1,x,0),p(t,-1,x,8),p('P',1,x,2),p('P',-1,x,6))});a.push(p('R',1,1,1),p('B',1,7,1),p('B',-1,1,7),p('R',-1,7,7));return a}
function home(){stopShoot();stopStageTimer();game=null;document.onkeydown=null;app.innerHTML='<section class="hero"><div><div class="eyebrow">A SHOGI GAME WITH A FATAL ERROR</div><h1>バグ<span>将棋</span></h1><div>その将棋、正常に動作していません。</div><div class="actions"><button class="btn primary" id="continue">'+(save.cleared.length?'つづきから →':'はじめる →')+'</button><button class="btn secondary" id="restart">最初から始める</button></div></div><div class="aside"><b>RULES ARE OPTIONAL.</b><br>駒の見た目はそのまま。<br>変わるのは、世界のルール。<br><br>全100ステージ / 10エリア<br>進行状況はこのブラウザに保存。</div></section><div class="head"><div><h2>STAGE SELECT / ステージ選択</h2><p>ステージを選んで、異常な対局を始めよう。</p></div><span class="id">'+save.cleared.length+' / 100 CLEARED</span></div><div class="area-row">'+areaNames.map((n,i)=>'<button class="area '+(i===area?'active':'')+'" data-area="'+i+'"><small>AREA 0'+(i+1)+' / STAGE '+String(i*10+1).padStart(3,'0')+'–'+String((i+1)*10).padStart(3,'0')+'</small><strong>'+n+'</strong></button>').join('')+'</div><div class="grid">'+stages.filter(s=>s.area===area).map(s=>'<button class="card '+(save.cleared.includes(s.id)?'clear':'')+'" data-stage="'+s.id+'" '+(s.id>save.max?'disabled':'')+'><span class="id">STAGE '+String(s.id).padStart(3,'0')+(s.boss?' ◆':'')+'</span><span class="name">'+s.name+'</span><span class="hint">'+hint(s.id)+'</span></button>').join('')+'</div><div class="head"><div><h2>HOW TO PLAY</h2><p>自軍の駒を選び、光るマスをクリック。敵王を取ればクリア。</p></div></div>';document.getElementById('continue').onclick=()=>start(save.max);document.getElementById('restart').onclick=()=>{if(confirm('セーブデータを消して、ステージ1から始めますか？')){save={cleared:[],max:1};saveIt();area=0;home()}};document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{area=+b.dataset.area;home()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{if(!b.disabled)start(+b.dataset.stage)})}

function formatStageTime(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function stopStageTimer(){if(limitTimer){clearInterval(limitTimer);limitTimer=null}}function startStageTimer(){stopStageTimer();limitTimer=setInterval(()=>{if(!game||!stage||stage.id!==74){stopStageTimer();return}game.timeLeft=Math.max(0,game.timeLeft-1);let label=document.getElementById('stageTimerText');if(label)label.textContent=formatStageTime(game.timeLeft);if(game.timeLeft<=0){stopStageTimer();defeat()}},1000)}function at(x,y){return game.pieces.find(q=>q.x===x&&q.y===y)}function blockedCell(x,y){if(stage.id<51)return false;let turn=Math.floor(game.ply/2),period=stage.id>=91?2:4;if(stage.id===84&&game.hazard)return x===game.hazard.x&&y===game.hazard.y;if(stage.id===55||stage.id===77){let r=Math.max(0,Math.floor(Math.max(0,turn-1)/3));return x<r||x>8-r||y<r||y>8-r}return [51,52,56,58,59,60,69,72,78,85,90,91,94,96,99,100].includes(stage.id)&&x===(turn*2+2)%9&&y===(turn*4+1)%9&&turn%period===period-1}

function finishPlayerAction(){if(stage.id===8||stage.id===63){game.playerActions++;if(game.playerActions<2){game.toast=stage.id===63?'時間加速：もう一手':'二回行動：もう一手指せます';draw();return}game.playerActions=0}if(stage.id===62){game.turn=-1;game.toast='時間停止：敵の手番をスキップ';draw();return}if(stage.id===84)game.hazard={x:1+Math.floor(Math.random()*7),y:1+Math.floor(Math.random()*7)};if(stage.id===92)game.randomRule=['P','N','B','R','G','S'][Math.floor(Math.random()*6)];if(stage.id===65&&++game.rewindCount%3===0&&game.actionSnapshot){game.pieces=game.actionSnapshot.map(a=>Object.assign({},a));game.sel=null;game.toast='巻き戻し発動！ 直前の一手が取り消された'}applyPiecePhysics();game.turn=1;game.enemyBonusUsed=false;game.toast='敵が考えています…';draw();setTimeout(ai,320)}
function spawnCopy(unit){if(game.cloneCount>=6)return false;for(let r=1;r<=2;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;let x=unit.x+dx,y=unit.y+dy;if(inside([x,y])&&!at(x,y)&&!blockedCell(x,y)){let c=Object.assign({},unit,{x,y});delete c.name;game.pieces.push(c);game.cloneCount++;return true}}return false}

function applyPiecePhysics(){if(stage.id===51){for(let q of game.pieces){let dy=q.s===1?1:-1,ny=q.y+dy;if(inside([q.x,ny])&&!at(q.x,ny)&&!blockedCell(q.x,ny))q.y=ny}}else if(stage.id===52){let falling=game.pieces.filter(q=>q.t!=='K');if(falling.length){let q=falling[Math.floor(Math.random()*falling.length)],dy=q.s===1?1:-1,ny=q.y+dy;if(inside([q.x,ny])&&!at(q.x,ny)&&!blockedCell(q.x,ny))q.y=ny}}}

function ai(){if(!game)return;let opts=[];game.pieces.filter(q=>q.s===1).forEach(q=>legal(q).forEach(c=>{let target=at(...c);opts.push({q,c,target,score:target?(target.t==='K'?1000:10):Math.random()*3})}));if(game.cheat)opts=opts.filter(a=>!(a.target&&a.target.t==='K'));opts.sort((a,b)=>b.score-a.score);let a=opts[0];if(!a){game.turn=-1;game.toast='敵は動けません。';draw();return}if(a.target&&usesPieceHP(stage.id)){let damage=Math.max(1,(stage.id===27?180:stage.id===29?90:60)-(a.target.armor||0));if(stage.id===33&&a.target.t==='R')damage=Math.ceil(damage/2);if(stage.id===35&&a.q.t==='L')damage+=80;a.target.hp-=damage;if(stage.id===37&&a.q.t==='S')a.q.hp=Math.max(1,a.q.hp-25);if(a.target.hp<=0){if(a.target.t==='K'){defeat();return}game.pieces=game.pieces.filter(q=>q!==a.target)}else{game.ply++;game.enemyTurns++;game.toast='敵の攻撃：'+damage+' ダメージ（残りHP '+a.target.hp+'）';continueEnemyTurn(game.toast);return}}else if(a.target){if(a.target.t==='K'){defeat();return}game.pieces=game.pieces.filter(q=>q!==a.target);if(stage.id===85)spawnCopy(a.q);if(stage.id===37&&a.target.t==='S'){if(a.q.t==='K'){victory();return}game.pieces=game.pieces.filter(q=>q!==a.q);game.ply++;game.enemyTurns++;game.toast='銀将の反射！ 敵の駒が破壊された';continueEnemyTurn(game.toast);return}}let ox=a.q.x,oy=a.q.y;slidePiece(a.q,ox,oy,a.c[0],a.c[1]);game.ply++;game.enemyTurns++;applyPiecePhysics();if(stage.id===84)game.hazard={x:1+Math.floor(Math.random()*7),y:1+Math.floor(Math.random()*7)};if(stage.id===92)game.randomRule=['P','N','B','R','G','S'][Math.floor(Math.random()*6)];if(stage.id===86&&game.enemyTurns%2===0)spawnPawn(1);if([10,36,73,85,87,96].includes(stage.id)&&game.enemyTurns%3===0)spawnPawn(1);if(stage.id===9&&game.enemyTurns%3===0||stage.id===10&&game.enemyTurns%2===0){game.turn=1;game.toast='敵の追加行動！';draw();setTimeout(ai,260);return}continueEnemyTurn('敵が指しました。あなたの手番です。')}
